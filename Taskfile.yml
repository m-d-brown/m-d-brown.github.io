# Taskfile.yml - Modern task runner for the m-d-brown.github.io repo
# Documentation: https://taskfile.dev

version: "3"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  setup:
    desc: "Set up everything needed to work on the site (Python + Node)"
    # The pieces below are internal, so this is the one setup entry point.
    # Nothing here is destructive on a healthy checkout: every step has a
    # status or sources/generates check, so a second run is a no-op and
    # `task setup` doubles as "put this checkout back in a working state".
    deps: [install-deps, install-node-deps]

  venv:
    desc: "Create the virtual environment, rebuilding it if it went stale"
    internal: true
    status:
      # A venv is not relocatable: every console script in .venv/bin hardcodes
      # its interpreter as an absolute path in the shebang. Move the checkout
      # and those scripts all die with "no such file or directory", even though
      # .venv/bin/python keeps working (it is a symlink to the system Python,
      # and sys.prefix is resolved at runtime). So probing python -- or just
      # testing that .venv exists -- would miss it. Check pip's shebang, which
      # is present in every venv, still points into this checkout.
      - grep -q "^#!{{.TASKFILE_DIR}}/.venv/bin/" .venv/bin/pip
    cmds:
      - rm -rf .venv
      - python3 -m venv .venv
      - ./.venv/bin/pip install --upgrade pip

  install-deps:
    desc: "Install Python dependencies and pre-commit hooks"
    internal: true
    deps: [venv]
    sources:
      - requirements.txt
    generates:
      - .venv/bin/pre-commit
    cmds:
      - ./.venv/bin/pip install -r requirements.txt
      - ./.venv/bin/pre-commit install
    silent: true

  install-node-deps:
    desc: "Install Node dependencies for the Astro site"
    internal: true
    sources:
      - package.json
      - package-lock.json
    generates:
      - node_modules/.package-lock.json
    cmds:
      - npm install
    silent: true

  lint:
    desc: "Run all linters and formatters on all files"
    deps: [install-deps]
    cmds:
      - ./.venv/bin/pre-commit run --all-files

  lint-staged:
    desc: "Run linters on staged files only (used by hooks)"
    deps: [install-deps]
    cmds:
      - ./.venv/bin/pre-commit run

  format:
    desc: "Rewrite every file in place with the formatters (prettier et al)"
    deps: [install-deps]
    cmds:
      # Every hook in .pre-commit-config.yaml is a fixer, so pre-commit edits
      # files in place and then exits non-zero to report that it changed
      # something. That is a failure for `lint`, but it is the entire point
      # here -- so ignore the first pass and let a second, now clean, pass
      # set the exit code. Anything no hook can fix fails both passes and
      # still fails the task.
      - cmd: ./.venv/bin/pre-commit run --all-files
        ignore_error: true
      - ./.venv/bin/pre-commit run --all-files

  preview:
    desc: "Start Astro local preview server"
    deps: [install-node-deps]
    cmds:
      - npm run dev

  build:
    desc: "Build the production site to ./dist"
    deps: [install-node-deps]
    cmds:
      - npm run build

  check-https:
    desc:
      "Verify the live redirect/TLS setup (Cloudflare + Pages), which lives
      outside this repo"
    # No deps: this checks the deployed site, so it must not need node_modules
    # or a build. Takes an optional domain, e.g. `task check-https -- example.com`.
    cmds:
      - ./script/check-https {{.CLI_ARGS}}

  ci-build:
    desc:
      "Reproduce the CI build locally (clean install + build; engine-strict
      enforces Node version)"
    cmds:
      - npm ci
      - npm run build
